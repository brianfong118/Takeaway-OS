<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- The title is the browser tab, the bookmark, and the headline of the link preview when
         this URL is pasted into a message or an application form. "takeaway-os-frontend" was the
         scaffold's default: a project directory name, shown to every visitor.

         "Demo" is in the title itself, not only in the on-page banner, because the title travels
         to places the banner cannot - a tab strip, a search result, a shared link. -->
    <title>TakeawayOS - Online Ordering Demo</title>

    <!-- Used as the preview text under the title in the same places. Written for a person deciding
         whether to click, which on this site is usually someone reading a CV or a portfolio. -->
    <meta
      name="description"
      content="A demo online ordering and order management system for an independent takeaway: menu, basket, checkout, Stripe payments, and owner and driver dashboards. Portfolio project - no real orders or payments."
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
